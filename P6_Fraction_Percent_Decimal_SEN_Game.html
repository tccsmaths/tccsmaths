<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小六數學科：分數、百分數和小數互化大冒險</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --secondary: #FF9F43;
            --success: #2ECC71;
            --danger: #FF6B6B;
            --warning: #F1C40F;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            font-family: "Chalkboard SE", "Comic Sans MS", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 4px solid #E1E8ED;
            position: relative;
        }

        /* Top Header Area */
        .game-header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-level {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            display: inline-block;
        }
        .level-easy { background-color: #2ED573; }
        .level-medium { background-color: #FFA502; }
        .level-hard { background-color: #FF4757; }

        .stats-bar {
            display: flex;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
            align-items: center;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px;
            background-color: #E2E8F0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b894, #00cec9);
            transition: width 0.4s ease;
        }

        /* Main Content Screen */
        .content-area {
            padding: 25px 30px;
        }

        .start-screen {
            text-align: center;
            padding: 30px 10px;
        }

        .start-screen h1 {
            color: #6C5CE7;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .start-screen p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-main {
            background-color: #FF9F43;
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #E67E22;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #E67E22;
            background-color: #FFA852;
        }

        .btn-main:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E67E22;
        }

        /* Question Box */
        .question-card {
            background-color: #F8FAFC;
            border: 3px solid #E2E8F0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            color: #2D3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-audio {
            background: #6C5CE7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #5A49E0;
            transition: all 0.2s;
        }

        .btn-audio:hover {
            background: #5A49E0;
        }

        .btn-audio:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5A49E0;
        }

        .visual-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            min-height: 120px;
            background: #FFFFFF;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #CBD5E0;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background-color: #FFFFFF;
            border: 3px solid #CBD5E0;
            border-radius: 14px;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            color: #2D3748;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 0 #CBD5E0;
        }

        .option-btn:hover {
            border-color: #4A90E2;
            background-color: #EBF8FF;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #357ABD;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #357ABD;
        }

        /* Modal / Explanation Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out;
            position: relative;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E2E8F0;
        }

        .modal-header.correct { color: #2ECC71; }
        .modal-header.incorrect { color: #FF6B6B; }

        .explanation-box {
            background-color: #FFF9DB;
            border: 2px solid #FFE066;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            line-height: 1.6;
            color: #495057;
        }

        .diagram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            background: #F8F9FA;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #CED4DA;
        }

        /* SVGs and Visual Helpers */
        .grid-100 {
            display: grid;
            grid-template-columns: repeat(10, 24px);
            grid-template-rows: repeat(10, 24px);
            gap: 2px;
            background-color: #333;
            padding: 3px;
            border-radius: 6px;
        }

        .grid-cell {
            background-color: #FFF;
            border-radius: 2px;
        }

        .grid-cell.shaded {
            background-color: #FF6B6B;
        }

        .grid-10 {
            display: grid;
            grid-template-columns: repeat(10, 28px);
            grid-template-rows: 35px;
            gap: 3px;
            background-color: #333;
            padding: 4px;
            border-radius: 6px;
        }

        .fraction-bar {
            display: flex;
            width: 280px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        .fraction-segment {
            flex: 1;
            border-right: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .fraction-segment:last-child {
            border-right: none;
        }

        .fraction-segment.shaded {
            background-color: #4D96FF;
            color: white;
        }

        /* End Screen */
        .end-screen {
            text-align: center;
            padding: 30px 15px;
        }

        .end-screen h2 {
            font-size: 32px;
            color: #6C5CE7;
            margin-bottom: 15px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9F43, #FF6B6B);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(255, 159, 67, 0.4);
        }

        .score-circle .number {
            font-size: 46px;
            font-weight: bold;
        }

        .score-circle .label {
            font-size: 14px;
        }

        .badge-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .badge-item {
            background: #F1F2F6;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #2F3542;
        }

        /* Feature Tags for SEN Support */
        .sen-feature-bar {
            background-color: #EBF8FF;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #2B6CB0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

    </style>
</head>

<div class="game-container">

    <div class="game-header">
        <div class="game-title">

</div>

</div>

<script>
    // Audio Synth Effects using Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
            osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.15); // F3
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // Cantonese TTS Speech Synthesis

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK'; // Hong Kong Cantonese
            utterance.rate = 0.85; // Slightly slower for SEN clear understanding
            window.speechSynthesis.speak(utterance);
        } else {
            alert("您的瀏覽器不支援語音合成功能。");
        }
    }

            visualType: "grid10",

        {

            question: "桌子上有 10 個貼紙，其中 3 個是星形貼紙。星形貼紙佔全部貼紙的百分之幾？",
            speechText: "桌子上有 10 個貼紙，其中 3 個是星形貼紙。星形貼紙佔全部貼紙的百分之幾？",
            options: ["30%", "3%", "300%", "13%"],

    let currentQIndex = 0;
    let score = 0;
    let correctCount = 0;

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('question-screen').style.display = 'block';
        currentQIndex = 0;
        score = 0;
        correctCount = 0;
        updateScore();
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQIndex];
        
        // Update header & badges
        document.getElementById('current-q-num').innerText = currentQIndex + 1;
        const levelBadge = document.getElementById('level-badge');
        levelBadge.innerText = q.level;
        levelBadge.className = `badge-level ${q.levelClass}`;

        // Update progress bar
        const progressPercent = ((currentQIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        // Question Title
        document.getElementById('question-title').innerText = q.question;

        // Render question visual if present
        const visualContainer = document.getElementById('question-visual-container');
        if (q.hasQuestionVisual) {
            visualContainer.style.display = 'flex';
            visualContainer.innerHTML = renderDiagram(q.questionVisualData.type, q.questionVisualData);
        } else {
            visualContainer.style.display = 'none';
            visualContainer.innerHTML = '';
        }

        // Render options
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            optionsGrid.appendChild(btn);
        });

        // Auto read question for SEN support
        readQuestion();
    }

    function readQuestion() {
        const q = questions[currentQIndex];
        speakCantonese(q.speechText || q.question);
    }

    function checkAnswer(selectedIndex) {
        const q = questions[currentQIndex];
        const modal = document.getElementById('explanation-modal');
        const modalHeader = document.getElementById('modal-header');
        const modalText = document.getElementById('modal-text-explanation');
        const modalDiagram = document.getElementById('modal-diagram-area');

        if (selectedIndex === q.answer) {
            // Correct
            playSound('correct');
            score += 10;
            correctCount++;
            updateScore();
            
            modalHeader.className = "modal-header correct";
            modalHeader.innerHTML = "🎉 太棒了！答對了！";
            modalText.innerHTML = `<strong>答案解析：</strong><br>${q.explanation}`;
        } else {
            // Wrong
            playSound('wrong');
            modalHeader.className = "modal-header incorrect";
            modalHeader.innerHTML = "💡 加油！我們一起看看解題圖形：";
            modalText.innerHTML = `<strong>正確答案是：${q.options[q.answer]}</strong><br><br><strong>解題步驟：</strong><br>${q.explanation}`;
        }

        // Render visual diagram in modal
        modalDiagram.innerHTML = renderDiagram(q.visualType, q.visualData);

        modal.style.display = 'flex';
    }

    function readExplanation() {
        const q = questions[currentQIndex];
        const plainTextExplanation = q.explanation.replace(/<br>/g, "。").replace(/<[^>]*>/g, "");
        speakCantonese(`正確答案是 ${q.options[q.answer]}。${plainTextExplanation}`);
    }

    function nextQuestion() {
        document.getElementById('explanation-modal').style.display = 'none';
        currentQIndex++;

        if (currentQIndex < questions.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
    }

    function renderDiagram(type, data) {
        if (type === 'grid100') {
            let cells = '';
            for (let i = 0; i < 100; i++) {
                const isShaded = i < data.shaded;
                cells += `<div class="grid-cell ${isShaded ? 'shaded' : ''}"></div>`;
            }
            return `
                <div style="text-align:center;">
                    <div class="grid-100">${cells}</div>
                    <p style="margin-top:8px; font-weight:bold; color:#2B6CB0;">${data.label || ''}</p>
                </div>
            `;
        } else if (type === 'grid10') {
            let cells = '';
            for (let i = 0; i < 10; i++) {
                const isShaded = i < data.shaded;
                cells += `<div class="grid-cell ${isShaded ? 'shaded' : ''}"></div>`;
            }
            return `
                <div style="text-align:center;">
                    <div class="grid-10">${cells}</div>
                    <p style="margin-top:8px; font-weight:bold; color:#2B6CB0;">${data.label || ''}</p>
                </div>
            `;
        } else if (type === 'bar') {
            let segments = '';
            for (let i = 0; i < data.total; i++) {
                const isShaded = i < data.shaded;
                segments += `<div class="fraction-segment ${isShaded ? 'shaded' : ''}">${i+1}</div>`;
            }
            return `
                <div style="text-align:center;">
                    <div class="fraction-bar">${segments}</div>
                    <p style="margin-top:8px; font-weight:bold; color:#2B6CB0;">${data.label || ''}</p>
                </div>
            `;
        } else if (type === 'mixed') {
            return `
                <div style="text-align:center;">
                    <div style="display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap;">
                        <div style="background:#4D96FF; color:white; padding:15px; border-radius:10px; font-weight:bold;">
                            完整 1 個整體 (100%)
                        </div>
                        <span style="font-size:24px; font-weight:bold;">+</span>
                        <div style="border:2px dashed #4D96FF; padding:10px; border-radius:10px;">
                            多出 ${data.extraShaded}%
                        </div>
                    </div>
                    <p style="margin-top:10px; font-weight:bold; color:#2B6CB0;">${data.label || ''}</p>
                </div>
            `;
        }
        return '';
    }

    function showEndScreen() {
        document.getElementById('question-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('progress-bar').style.width = '100%';

        document.getElementById('final-score').innerText = score;
        document.getElementById('correct-count').innerText = correctCount;

        let stars = "⭐⭐⭐";
        let msg = "非常出色！你已經完全掌握了分數、百分數和小數互化！";

        if (correctCount < 12) {
            stars = "⭐";
            msg = "繼續加油！多做幾次練習，你會變得越來越棒！";
        } else if (correctCount < 17) {
            stars = "⭐⭐";
            msg = "做得很好！已經掌握了大部分題目呢！";
        }

        document.getElementById('star-rating').innerText = stars;
        document.getElementById('final-message').innerText = msg;
        speakCantonese(`挑戰完成！你的得分是 ${score} 分。${msg}`);
    }

    function restartGame() {
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }
</script>
