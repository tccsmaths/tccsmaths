                steps: [

                    '算式：11 ÷ 1000 = 0.011 （小數點左移 3 位）'
                ],
                rule: '先找出「最小兩位奇數」為 11，再計算除以 1000。',
                explanationText: '最小的兩位奇數是 11。11 ÷ 1000 的小數點向左移動 3 位，結果為 0.011。'
            },
            {
                id: 18,
                level: 3,
                levelName: '高級：代數與規律',
                questionText: '如果 0.123 ÷ ★ = 1.23，那麼 500 ÷ 100 ÷ ★ = ?',
                spokenText: '如果零點一二三除以星號等於一點二三，那麼五百除以一百再除以星號等於多少？',
                options: ['0.5', '5', '50'],
                answer: '50',
                type: 'multi_step',
                steps: [
                    '第一步：由 0.123 ÷ ★ = 1.23，得知 ★ = 0.1（小數點右移 1 位）',
                    '第二步：500 ÷ 100 = 5',
                    '第三步：5 ÷ ★ = 5 ÷ 0.1 = 50'
                ],
                rule: '先求出符號 ★ 代表 0.1，再代入後面的算式求解。',
                explanationText: '因為 0.123 變成 1.23 表示乘以 10，故 ★ 為 0.1。500 ÷ 100 = 5，5 ÷ 0.1 = 50。'
            },
            {
                id: 19,
                level: 3,
                levelName: '高級：小數性質推理',
                questionText: '如果甲數是一個兩位小數，要得到最小的商，應該將甲數除以哪一個數？',
                spokenText: '如果甲數是一個兩位小數，要得到最小的商，應該將甲數除以哪一個數？',
                options: ['10', '100', '0.1', '0.01'],
                answer: '100',
                type: 'logic_reasoning',
                rule: '口訣：被除數相同時，除數越大，計算出的【商】便越小。',
                explanationText: '在選項 10、100、0.1、0.01 中，100 是最大的數。除以最大的數（100）會得到最小的商。'
            },
            {
                id: 20,
                level: 3,
                levelName: '高級：綜合比較題',
                questionText: '以下哪道算式的結果大於 1？',
                spokenText: '以下哪道算式的結果大於一？',
                options: ['A. 0.54 ÷ 0.1', 'B. 54 ÷ 100', 'C. 0.54 ÷ 10', 'D. 0.0054 ÷ 0.01'],
                answer: 'A. 0.54 ÷ 0.1',
                type: 'comparison_table',
                comparisons: [
                    { expr: 'A. 0.54 ÷ 0.1', val: '5.4 (大於 1 !)' },
                    { expr: 'B. 54 ÷ 100', val: '0.54' },
                    { expr: 'C. 0.54 ÷ 10', val: '0.054' },
                    { expr: 'D. 0.0054 ÷ 0.01', val: '0.54' }
                ],
                rule: '被除數比除數大時，答案便大於 1。0.54 ÷ 0.1 = 5.4 > 1。',
                explanationText: 'A 的結果是 5.4（大於 1）；B 是 0.54；C 是 0.054；D 是 0.54。所以選 A。'
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        let selectedVoice = null;

        function initCantoneseVoice() {
            if ('speechSynthesis' in window) {
                const updateVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Prefer Cantonese zh-HK, fallback to Cantonese/Hong Kong variants or Mandarin
                    selectedVoice = voices.find(v => v.lang === 'zh-HK' || v.lang.includes('HK') || v.lang.includes('yue')) ||
                                    voices.find(v => v.lang.includes('zh')) || null;
                };
                updateVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = updateVoices;
                }
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // stop previous speech

            const utterance = new SpeechSynthesisUtterance(text);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'zh-HK';
            utterance.rate = 0.82; // Slower, clear speed ideal for SEN students
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function readQuestionTTS() {
            const q = questionBank[currentQuestionIndex];
            speakText(q.spokenText || q.questionText);
        }

        function readExplanationTTS() {
            const q = questionBank[currentQuestionIndex];
            const textToRead = `${q.rule}。${q.explanationText}`;
            speakText(textToRead);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    // Ascending happy chime
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.25); // G5
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    // Gentle low warning bump
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.exponentialRampToValueAtTime(164.81, audioCtx.currentTime + 0.2); // E3
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {
                console.log('Audio playback fallback');
            }
        }

        function renderQuestion() {
            isAnswered = false;
            const q = questionBank[currentQuestionIndex];

            // Update Header Progress
            document.getElementById('currentQNum').innerText = currentQuestionIndex + 1;
            document.getElementById('scoreDisplay').innerText = score;
            
            const pct = Math.round(((currentQuestionIndex + 1) / questionBank.length) * 100);
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressPercent').innerText = `${pct}%`;

            // Update Level Badge
            const levelBadge = document.getElementById('levelBadge');
            if (q.level === 1) {
                levelBadge.innerText = '初級關卡';
                levelBadge.className = 'font-bold text-emerald-800 bg-emerald-100 border-2 border-emerald-300 px-3 py-1.5 rounded-xl text-sm';
            } else if (q.level === 2) {
                levelBadge.innerText = '中級關卡';
                levelBadge.className = 'font-bold text-amber-800 bg-amber-100 border-2 border-amber-300 px-3 py-1.5 rounded-xl text-sm';
            } else {
                levelBadge.innerText = '高級關卡';
                levelBadge.className = 'font-bold text-purple-800 bg-purple-100 border-2 border-purple-300 px-3 py-1.5 rounded-xl text-sm';
            }

            // Update Question Title
            document.getElementById('questionTag').innerHTML = `<i class="fa-solid fa-flag"></i> 第 ${q.id} 題 • ${q.levelName}`;
            document.getElementById('questionText').innerText = q.questionText;

            // Render Option Buttons
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-full bg-sky-50 hover:bg-sky-100 border-3 border-sky-300 text-sky-900 font-black text-xl md:text-2xl p-5 rounded-2xl text-center flex items-center justify-between shadow-sm border-2 transition-all hover:border-sky-500`;
                btn.onclick = () => checkAnswer(opt);
                
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-sky-200 text-sky-800 flex items-center justify-center font-bold text-base mr-3">
                        ${String.fromCharCode(65 + idx)}
                    </span>
                    <span class="flex-grow text-center">${opt}</span>
                    <i class="fa-solid fa-circle-chevron-right text-sky-400 text-xl opacity-0 hover:opacity-100"></i>
                `;
                optionsContainer.appendChild(btn);
            });

            // Update Mascot Encouragement Message
            const mascotMsgs = [
                "相信自己！細心看看小數點移動幾多位！",
                "你可以的！記得除以大數會變小，除以小數會變大！",
                "放輕鬆～看清楚題目再按答案喔！",
                "太棒了！一步一步來，你做得很好！"
            ];
            document.getElementById('mascotMessage').innerText = mascotMsgs[currentQuestionIndex % mascotMsgs.length];

            // Auto read question for SEN support if speech enabled
            setTimeout(() => {
                readQuestionTTS();
            }, 300);
        }

        function checkAnswer(selectedOpt) {
            if (isAnswered) return;
            isAnswered = true;

            const q = questionBank[currentQuestionIndex];
            if (selectedOpt === q.answer) {
                // Correct Answer!
                playSound('correct');
                score += 5;
                document.getElementById('scoreDisplay').innerText = score;

                // Mascot praise
                speakText("答對了！太厲害了！");
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questionBank.length) {
                        renderQuestion();
                    } else {
                        showVictoryScreen();
                    }
                }, 1200);

            } else {
                // Incorrect Answer -> Trigger SEN Visual Explanation Modal
                playSound('wrong');
                speakText("答錯了，沒關係！我們一起看圖解！");
                showExplanationModal(q);
            }
        }

        function showExplanationModal(q) {
            document.getElementById('explanationRuleBox').innerText = `💡 解題關鍵：${q.rule}`;
            document.getElementById('explanationText').innerText = q.explanationText;

            const graphicContainer = document.getElementById('placeValueGraphicContainer');
            graphicContainer.innerHTML = '';

            if (q.type === 'shift_left' || q.type === 'shift_right') {
                // Generate Place Value Chart (百位, 十位, 個位, ., 十分位, 百分位, 千分位)
                graphicContainer.appendChild(createPlaceValueTable(q));
            } else if (q.type === 'comparison_table') {
                // Generate Comparison Grid
                graphicContainer.appendChild(createComparisonGrid(q));
            } else if (q.type === 'multi_step') {
                // Generate Multi-Step Flowchart
                graphicContainer.appendChild(createMultiStepFlowchart(q));
            } else {
                // Default simple visual box
                graphicContainer.innerHTML = `
                    <div class="p-4 bg-sky-100 rounded-xl text-sky-900 font-bold text-center text-lg">
                        ${q.questionText}
                        <div class="mt-2 text-amber-700 text-2xl font-black">正解：${q.answer}</div>
                    </div>
                `;
            }

            document.getElementById('explanationModal').classList.remove('hidden');
        }

        // Helper 1: Place Value Table with animated directional arrow
        function createPlaceValueTable(q) {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center gap-3 w-full my-2";

            const isLeft = q.type === 'shift_left';
            const arrowDirection = isLeft ? '← 向左移動 (數值縮小)' : '向右移動 (數值變大) →';
            const arrowBg = isLeft ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300';

            wrapper.innerHTML = `
                <div class="text-xs font-bold px-3 py-1 rounded-full border ${arrowBg} mb-1 flex items-center gap-1">
                    <i class="fa-solid ${isLeft ? 'fa-arrow-left' : 'fa-arrow-right'}"></i>
                    <span>小數點 ${arrowDirection} ${q.shifts} 位</span>
                </div>

                <!-- Table Header -->
                <div class="grid grid-cols-7 gap-1 w-full text-center font-bold text-xs md:text-sm bg-sky-200 p-2 rounded-t-xl text-sky-900">
                    <div>百位</div>
                    <div>十位</div>
                    <div>個位</div>
                    <div class="text-red-600 font-black">.</div>
                    <div>十分位</div>
                    <div>百分位</div>
                    <div>千分位</div>
                </div>

                <!-- Numerical visualization SVG/HTML -->
                <div class="grid grid-cols-7 gap-1 w-full text-center font-black text-lg md:text-xl bg-white border-2 border-sky-200 p-3 rounded-b-xl shadow-inner">
                    <div id="cell-100" class="text-slate-400">-</div>
                    <div id="cell-10" class="text-slate-800"></div>
                    <div id="cell-1" class="text-slate-800"></div>
                    <div class="text-red-500 text-2xl font-black">.</div>
                    <div id="cell-01" class="text-slate-800"></div>
                    <div id="cell-001" class="text-slate-800"></div>
                    <div id="cell-0001" class="text-slate-400">-</div>
                </div>

                <div class="mt-2 text-sm text-slate-600 font-bold bg-white px-4 py-2 rounded-xl border border-slate-200">
                    原數：<span class="text-blue-600 text-lg">${q.numStr}</span> 
                    → 計算後結果：<span class="text-emerald-600 text-xl font-black">${q.answer}</span>
                </div>
            `;

            return wrapper;
        }

        // Helper 2: Comparison Grid generator
        function createComparisonGrid(q) {
            const container = document.createElement('div');
            container.className = "space-y-2 w-full";

            q.comparisons.forEach(item => {
                const isTarget = item.expr.includes(q.answer) || item.val.includes('不同') || item.val.includes('大於 1');
                const rowClass = isTarget 
                    ? 'bg-amber-100 border-2 border-amber-400 text-amber-900 font-black' 
                    : 'bg-white border border-slate-200 text-slate-700';

                container.innerHTML += `
                    <div class="p-3 rounded-xl flex justify-between items-center ${rowClass}">
                        <span>${item.expr}</span>
                        <span class="text-base font-bold">= ${item.val}</span>
                    </div>
                `;
            });

            return container;
        }

        // Helper 3: Multi-step Flowchart generator
        function createMultiStepFlowchart(q) {
            const container = document.createElement('div');
            container.className = "flex flex-col gap-2 w-full";

            q.steps.forEach((stepText, idx) => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border-2 border-purple-200 flex items-center space-x-3">
                        <div class="w-7 h-7 bg-purple-600 text-white font-black rounded-full flex items-center justify-center text-sm flex-shrink-0">
                            ${idx + 1}
                        </div>
                        <div class="text-purple-950 font-bold text-sm md:text-base">${stepText}</div>
                    </div>
                `;
            });

            return container;
        }

        function retryCurrentQuestion() {
            document.getElementById('explanationModal').classList.add('hidden');
            renderQuestion();
        }

        function showVictoryScreen() {
            playSound('correct');
            document.getElementById('finalScore').innerText = score;
            
            const badge = document.getElementById('finalBadge');
            if (score >= 90) {
                badge.innerText = '小數點特級大師 🏆🌟';
            } else if (score >= 70) {
                badge.innerText = '小數點冒險專家 ⭐';
            } else {
                badge.innerText = '小數點學習勇者 👍';
            }

            document.getElementById('victoryModal').classList.remove('hidden');
            speakText("恭喜你完成所有小數除法題目！你太優秀了！");
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('victoryModal').classList.add('hidden');
            renderQuestion();
        }

        window.onload = function() {
            initCantoneseVoice();
            renderQuestion();
        };
    </script>
</body>
</html>
