        // Audio Context for synthesized sound effects (No external MP3 files needed)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // Happy high chord (C5, E5, G5, C6)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'wrong') {
                // Low gentle error sound
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(164.81, now + 0.15); // E3
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'win') {
                // Fanfare
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.15);
                osc.frequency.setValueAtTime(783.99, now + 0.3);
                osc.frequency.setValueAtTime(1046.50, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                osc.start(now);
                osc.stop(now + 0.9);
            }
        }

            let optionsWithOrigIndex = question.options.map((opt, idx) => ({ text: opt, isCorrect: idx === question.answer }));
            // Fisher-Yates shuffle
            for (let i = optionsWithOrigIndex.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsWithOrigIndex[i], optionsWithOrigIndex[j]] = [optionsWithOrigIndex[j], optionsWithOrigIndex[i]];
            }
            return optionsWithOrigIndex;
        }

        let currentShuffledOptions = [];

        function loadQuestion() {
            // Hide modal if open
            document.getElementById('visual-modal').classList.add('hidden');
            
            const q = questions[currentQuestionIdx];
            
            // Update Level Header Badge
            const levelBadge = document.getElementById('level-badge');
            if (currentQuestionIdx < 10) {
                levelBadge.innerText = "關卡一：基礎移動小數點 (1-10題)";
                levelBadge.className = "text-xs md:text-sm font-bold text-sky-700 bg-sky-100 px-3 py-1 rounded-full border border-sky-300";
            } else {
                levelBadge.innerText = "關卡二：進階填空與比較 (11-20題)";
                levelBadge.className = "text-xs md:text-sm font-bold text-purple-700 bg-purple-100 px-3 py-1 rounded-full border border-purple-300";
            }

            // Update Progress Bar & Question Count
            document.getElementById('question-number').innerText = `第 ${currentQuestionIdx + 1} / ${questions.length} 題`;
            const progressPercent = ((currentQuestionIdx + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Set Question Text
            document.getElementById('question-text').innerText = q.text;

            // Generate Option Buttons
            currentShuffledOptions = getShuffledOptions(q);
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const optionColors = [
                "bg-amber-100 border-amber-300 hover:bg-amber-200 text-amber-900",
                "bg-sky-100 border-sky-300 hover:bg-sky-200 text-sky-900",
                "bg-emerald-100 border-emerald-300 hover:bg-emerald-200 text-emerald-900",
                "bg-rose-100 border-rose-300 hover:bg-rose-200 text-rose-900"
            ];

            currentShuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left font-black text-xl md:text-2xl p-5 md:p-6 rounded-2xl border-4 transition transform active:scale-95 shadow-md flex items-center gap-3 ${optionColors[idx % 4]}`;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn);
                btn.innerHTML = `<span class="bg-white/80 w-10 h-10 rounded-xl inline-flex items-center justify-center border border-black/10 text-lg">${['A','B','C','D'][idx]}</span> <span>${opt.text}</span>`;
                container.appendChild(btn);
            });

            // Automatically read question text for Cantonese Speech support
            readCurrentQuestion();
        }

        function checkAnswer(isCorrect, buttonElem) {
            playSound('click');
            const q = questions[currentQuestionIdx];

            // Disable option buttons during feedback
            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                playSound('correct');
                buttonElem.classList.remove('bg-amber-100', 'bg-sky-100', 'bg-emerald-100', 'bg-rose-100');
                buttonElem.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'pulse-slow');

                combo++;
                score += 100 + (combo * 20);
                correctAnswersCount++;

                document.getElementById('score-text').innerText = score;
                document.getElementById('combo-text').innerText = `x${combo}`;

                setTimeout(() => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx < questions.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 1200);

            } else {
                playSound('wrong');
                buttonElem.classList.add('bg-rose-500', 'text-white', 'border-rose-700', 'shake');
                combo = 0;
                document.getElementById('combo-text').innerText = `x0`;

                // Highlight correct answer button
                buttons.forEach((btn, idx) => {
                    if (currentShuffledOptions[idx].isCorrect) {
                        btn.classList.add('ring-4', 'ring-emerald-400');
                    }
                });

                // Show Place-Value Visual Explanation Modal
                setTimeout(() => {
                    renderVisualExplanation(q);
                }, 800);
            }
        }

        function renderVisualExplanation(q) {
            const modal = document.getElementById('visual-modal');
            modal.classList.remove('hidden');

            document.getElementById('explanation-text').innerText = q.explanation;

            // Build Place Value Table Row
            const tbody = document.getElementById('pv-table-body');
            tbody.innerHTML = '';

            // Example place value positions mapping
            // 百位, 十位, 個位, ., 十分位, 百分位, 千分位
            let initialRow = `<tr class="font-black text-base md:text-lg text-slate-800">
                <td class="pv-cell bg-slate-100 text-xs text-slate-500">數值變化</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 100)}</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 10)}</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 1)}</td>
                <td class="pv-cell bg-amber-100 text-amber-900 font-bold">.</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 0.1)}</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 0.01)}</td>
                <td class="pv-cell">${extractDigit(q.initialNum, 0.001)}</td>
            </tr>`;

            tbody.innerHTML = initialRow;

            // Render Animated Shift Arrow Graphic
            const arrowGraphic = document.getElementById('arrow-graphic');
            let arrowHTML = '';

            if (q.shiftDirection === 'left') {
                arrowHTML = `
                    <div class="flex items-center justify-center gap-2 text-rose-600 font-black text-lg md:text-xl">
                        <span>${q.initialNum}</span>
                        <span class="text-2xl animate-pulse">👈 向左移動 ${q.shiftPlaces} 位</span>
                        <span class="bg-emerald-600 text-white px-3 py-1 rounded-xl">${q.resultNum}</span>
                    </div>
                    <p class="text-xs md:text-sm text-slate-600 font-bold mt-2">（除以 10 / 100 / 1000 ➔ 數字變小，小數點向左移）</p>
                `;
            } else if (q.shiftDirection === 'right') {
                arrowHTML = `
                    <div class="flex items-center justify-center gap-2 text-emerald-600 font-black text-lg md:text-xl">
                        <span>${q.initialNum}</span>
                        <span class="text-2xl animate-pulse">向右移動 ${q.shiftPlaces} 位 👉</span>
                        <span class="bg-emerald-600 text-white px-3 py-1 rounded-xl">${q.resultNum}</span>
                    </div>
                    <p class="text-xs md:text-sm text-slate-600 font-bold mt-2">（除以 0.1 / 0.01 / 0.001 ➔ 數字變大，小數點向右移）</p>
                `;
            } else {
                arrowHTML = `
                    <div class="flex items-center justify-center gap-2 text-purple-700 font-black text-lg md:text-xl">
                        <span>綜合計算結果 ➔ </span>
                        <span class="bg-purple-600 text-white px-4 py-1.5 rounded-xl text-2xl">${q.resultNum}</span>
                    </div>
                `;
            }

            arrowGraphic.innerHTML = arrowHTML;

            // Read explanation voice automatically
            readExplanation();
        }

        // Helper to extract digit for place value visualization
        function extractDigit(numStr, place) {
            const val = parseFloat(numStr);
            if (isNaN(val)) return "-";
            
            if (place === 100) {
                let d = Math.floor((val % 1000) / 100);
                return d > 0 ? d : "-";
            }
            if (place === 10) {
                let d = Math.floor((val % 100) / 10);
                return (d > 0 || val >= 100) ? d : "-";
            }
            if (place === 1) {
                let d = Math.floor(val % 10);
                return d;
            }
            
            // Decimals
            let decimals = numStr.split('.')[1] || "";
            if (place === 0.1) return decimals[0] || "0";
            if (place === 0.01) return decimals[1] || "0";
            if (place === 0.001) return decimals[2] || "0";

            return "-";
        }

        function nextQuestion() {
            playSound('click');
            currentQuestionIdx++;
            if (currentQuestionIdx < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function readCurrentQuestion() {
            if (!soundEnabled) return;
            const q = questions[currentQuestionIdx];
            speakCantonese(q.speakText || q.text);
        }

        function readExplanation() {
            if (!soundEnabled) return;
            const q = questions[currentQuestionIdx];
            speakCantonese(q.explanation);
        }

        function speakCantonese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop active speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK'; // Cantonese Hong Kong
                utterance.rate = 0.85; // SEN Friendly slightly slower speech rate
                utterance.pitch = 1.0;

                // Select Hong Kong voice if available
                const voices = window.speechSynthesis.getVoices();
                const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK' || v.name.includes('Hong Kong') || v.name.includes('Cantonese'));
                if (hkVoice) {
                    utterance.voice = hkVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        function showResults() {
            playSound('win');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('visual-modal').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = `${correctAnswersCount} / ${questions.length}`;

            // Calculate Stars
            const starsElem = document.getElementById('stars-container');
            const evalElem = document.getElementById('final-eval');

            if (correctAnswersCount >= 18) {
                starsElem.innerText = "⭐⭐⭐";
                evalElem.innerText = "🌟 太厲害了！你是小數除法大師！所有小數點移動都難不倒你！";
            } else if (correctAnswersCount >= 12) {
                starsElem.innerText = "⭐⭐";
                evalElem.innerText = "👍 做得很好！你已經基本掌握了小數點移動的規律！";
            } else {
                starsElem.innerText = "⭐";
                evalElem.innerText = "💪 繼續加油！多看幾次圖解說明，小數除法會變得越來越簡單！";
            }

            speakCantonese(`冒險完成！你的得分是 ${score} 分。` + evalElem.innerText);
        }

        function restartGame() {
            playSound('click');
            currentQuestionIdx = 0;
            score = 0;
            combo = 0;
            correctAnswersCount = 0;

            document.getElementById('score-text').innerText = '0';
            document.getElementById('combo-text').innerText = 'x0';

            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');

            loadQuestion();
        }

        // Initialize game on window load
        window.onload = function() {
            // Ensure Web Speech API voice list is populated
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = function() {
                    window.speechSynthesis.getVoices();
                };
            }
            loadQuestion();
        };
    </script>
</body>
